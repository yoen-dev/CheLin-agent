<!DOCTYPE html>
<!--
  frontend/index.html
  ------------------------------------------------------------
  故意不用任何前端框架（React/Vue）、不打包——单文件 HTML + 原生 JS，
  用 fetch 直接打后端的 /chat 接口。题目原话是"越简单越好，重点不在这里"，
  这里的重点是把 agent 每一步的内部决策(intent/emotion/action/state)
  都展示出来，方便答辩现场演示"约束1/2/3/4分别在什么时候生效"。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>获客初筛 Agent - 模拟客户对话</title>
<style>
  :root { --ink: #17242a; --muted: #6f7d80; --line: #dbe4df; --paper: #fffdf8; --mint: #d8f0e6; --green: #1d6b51; --coral: #d9664f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 8% 0%, #d9efe5 0, transparent 32%), #f4f0e7; font-family: Georgia, "Noto Serif SC", serif; }
  .app { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 56px; }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
  .eyebrow { margin: 0 0 8px; color: var(--green); font: 700 11px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 46px); line-height: 1; font-weight: 500; }
  .intro { max-width: 360px; margin: 0; color: var(--muted); font: 14px/1.65 Arial, sans-serif; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(270px, .75fr); gap: 18px; align-items: start; }
  .chat-card, #panel { background: rgba(255, 253, 248, .92); border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(35, 61, 51, .09); }
  .chat-card { overflow: hidden; border-radius: 16px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); background: #fbfaf5; font: 13px Arial, sans-serif; }
  .identity { display: flex; align-items: center; gap: 9px; }
  .presence { width: 9px; height: 9px; border-radius: 50%; background: #4ca779; box-shadow: 0 0 0 4px #dff0e6; }
  .connection { color: var(--muted); font-size: 12px; }
  #chatBox { height: min(58vh, 520px); min-height: 340px; overflow-y: auto; padding: 24px 20px; background: linear-gradient(180deg, #fbfaf6, #f7f4ec); }
  .empty { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; font: 14px/1.7 Arial, sans-serif; }
  .empty strong { display: block; color: var(--ink); font: 20px Georgia, serif; }
  .msg { width: fit-content; max-width: min(78%, 560px); margin: 10px 0; padding: 12px 15px; border-radius: 14px; white-space: pre-wrap; font: 15px/1.6 Arial, sans-serif; animation: rise .22s ease-out; }
  .customer { margin-left: auto; color: #17382d; background: var(--mint); border-bottom-right-radius: 4px; }
  .agent { color: #273238; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .pending { color: var(--muted); background: #f1f5f1; border: 1px dashed #b9ccc0; font-size: 13px; }
  .pending::after { content: ""; display: inline-block; width: 1em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
  .sysnote { max-width: 100%; color: #8a4e22; background: #fff0d6; border: 1px solid #f0d8ae; text-align: center; font-size: 12px; }
  .composer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); background: #fffdf8; }
  input[type=text] { min-width: 0; flex: 1; padding: 12px 14px; color: var(--ink); background: #fff; border: 1px solid #cddbd4; border-radius: 10px; outline: none; font: 14px Arial, sans-serif; }
  input[type=text]:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29, 107, 81, .12); }
  button { padding: 11px 17px; color: #fff; background: var(--green); border: 0; border-radius: 9px; cursor: pointer; font: 700 13px Arial, sans-serif; transition: transform .15s, background .15s; }
  button:hover { background: #15563f; transform: translateY(-1px); }
  button:disabled { opacity: .55; cursor: wait; transform: none; }
  button.secondary { color: var(--green); background: transparent; border: 1px solid #b9d4c8; }
  button.secondary:hover { background: #e9f4ee; }
  #panel { padding: 20px; border-radius: 16px; font: 13px/1.5 Arial, sans-serif; }
  #panel h2 { margin: 0 0 16px; font: 500 20px Georgia, serif; }
  .field { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid #e8eee9; }
  .field:last-child { border-bottom: 0; }
  .field span:first-child { color: var(--muted); }
  .field span:last-child { max-width: 58%; text-align: right; overflow-wrap: anywhere; }
  .tag { display: inline-block; padding: 3px 9px; border-radius: 99px; color: #fff; font-size: 11px; font-weight: 700; }
  .state-active { background: #3f986a; }
  .state-escalated { background: var(--coral); }
  .customer-settings { display: flex; align-items: center; gap: 8px; margin-top: 14px; font: 12px Arial, sans-serif; color: var(--muted); }
  #customerId { width: 170px; padding: 8px 10px; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes dots { 0%, 20% { content: ""; } 40% { content: "."; } 60% { content: ".."; } 80%, 100% { content: "..."; } }
  @media (max-width: 760px) { .app { width: min(100% - 20px, 620px); padding-top: 26px; } .masthead { display: block; } .intro { margin-top: 12px; } .workspace { grid-template-columns: 1fr; } #panel { order: 2; } .msg { max-width: 88%; } }
</style>
</head>
<body>
<main class="app">
  <header class="masthead">
    <div><p class="eyebrow">Customer screening / Live demo</p><h1>获客初筛对话台</h1></div>
    <p class="intro">以客户身份发送消息，实时查看 Agent 的回复和决策状态。</p>
  </header>
  <div class="workspace">
    <section class="chat-card" aria-label="客户对话">
      <div class="toolbar"><div class="identity"><span class="presence"></span><strong>初筛助手</strong></div><span class="connection" id="connection">正在连接...</span></div>
      <div id="chatBox"><div class="empty"><div><strong>从一句问候开始</strong>输入消息，开始一段真实的对话。</div></div></div>
      <div class="composer"><input id="msgInput" type="text" placeholder="输入客户消息，按 Enter 发送..." autocomplete="off" /><button id="sendButton" type="button">发送</button></div>
    </section>
    <aside>
      <div id="panel">
        <h2>决策状态</h2>
        <div class="field"><span>会话状态</span><span id="stateTag" class="tag state-active">ACTIVE</span></div>
        <div class="field"><span>连续异常</span><span id="badStreak">0</span></div>
        <div class="field"><span>最近意图</span><span id="lastIntent">-</span></div>
        <div class="field"><span>最近情绪</span><span id="lastEmotion">-</span></div>
        <div class="field"><span>最近动作</span><span id="lastAction">-</span></div>
        <div class="field"><span>LLM 判断次数</span><span id="votesCount">-</span></div>
        <div class="field"><span>复盘仲裁</span><span id="usedReview">-</span></div>
        <div class="field"><span>说明</span><span id="lastNote">-</span></div>
      </div>
      <div class="customer-settings"><label for="customerId">客户 ID</label><input id="customerId" type="text" value="demo-customer-1" /><button class="secondary" id="reactivateButton" type="button">重新激活</button></div>
    </aside>
  </div>
</main>

<script>
const API_BASE = window.location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
let isSending = false;

function appendMsg(role, text) {
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function showPending() {
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = "msg pending";
  div.id = "pendingMessage";
  div.textContent = "正在生成回复";
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function hidePending() {
  const pending = document.getElementById("pendingMessage");
  if (pending) pending.remove();
}

function clearEmptyState() {
  const empty = document.querySelector(".empty");
  if (empty) empty.remove();
}

function setSending(sending) {
  isSending = sending;
  document.getElementById("sendButton").disabled = sending;
  document.getElementById("msgInput").disabled = sending;
  document.getElementById("connection").textContent = sending ? "正在处理..." : "在线 · Mock / Gemini";
}

async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById("msgInput");
  const customerId = document.getElementById("customerId").value.trim() || "demo-customer-1";
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  clearEmptyState();
  appendMsg("customer", text);
  setSending(true);
  showPending();

  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_id: customerId, message: text }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
    renderResult(data);
  } catch (e) {
    hidePending();
    appendMsg("sysnote", "请求失败，请确认后端已启动在 " + API_BASE + "（" + e + "）");
  } finally {
    hidePending();
    setSending(false);
    input.focus();
  }
}

function renderResult(data) {
  clearEmptyState();
  hidePending();
  if (data.reply_text) {
    appendMsg("agent", data.reply_text);
  } else if (data.action === "escalate_to_human") {
    appendMsg("sysnote", "[系统] 已转人工，agent 保持静默");
  } else if (data.action === "mark_not_interested") {
    appendMsg("sysnote", "[系统] 客户被标记为不感兴趣，会话结束");
  } else if (data.action === "schedule_followup") {
    appendMsg("sysnote", "[系统] 本轮不回复，已标记稍后跟进（" + (data.note || "") + "）");
  }

  document.getElementById("stateTag").textContent = data.state.toUpperCase();
  document.getElementById("stateTag").className = "tag state-" + data.state;
  document.getElementById("badStreak").textContent = data.bad_streak;
  document.getElementById("lastIntent").textContent = data.intent || "-";
  document.getElementById("lastEmotion").textContent = data.emotion_negative === true ? "不满" : (data.emotion_negative === false ? "正常" : "-");
  document.getElementById("lastAction").textContent = data.action;
  document.getElementById("votesCount").textContent = data.votes_count;
  document.getElementById("usedReview").textContent = data.used_review ? "是（出现分歧，已复盘）" : "否（多数一致）";
  document.getElementById("lastNote").textContent = data.note || "-";
}

async function reactivate() {
  const customerId = document.getElementById("customerId").value.trim() || "demo-customer-1";
  try {
    const resp = await fetch(`${API_BASE}/admin/reactivate/${encodeURIComponent(customerId)}`, { method: "POST" });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
    clearEmptyState();
    appendMsg("sysnote", "[系统] 人工已重新激活，state=" + data.state);
    document.getElementById("stateTag").textContent = data.state.toUpperCase();
    document.getElementById("stateTag").className = "tag state-" + data.state;
    document.getElementById("badStreak").textContent = "0";
  } catch (e) {
    appendMsg("sysnote", "重新激活失败：" + e.message);
  }
}

document.getElementById("sendButton").addEventListener("click", sendMessage);
document.getElementById("reactivateButton").addEventListener("click", reactivate);
document.getElementById("msgInput").addEventListener("keydown", (event) => {
  if (event.key === "Enter") sendMessage();
});
document.getElementById("connection").textContent = "在线 · Mock / Gemini";
</script>
</body>
</html>
